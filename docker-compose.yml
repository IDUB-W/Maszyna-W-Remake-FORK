services:
  ws-relay:
    build:
      context: .
      dockerfile: Dockerfile.ws
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  hf-proxy:
    build:
      context: ./HfProxy
      dockerfile: Dockerfile
    env_file:
      - ./HfProxy/.env
    environment:
      PORT: "8787"
    ports:
      - "8787:8787"
    restart: unless-stopped
