apiVersion: v1
kind: Namespace
metadata:
  name: maszyna-w
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hf-proxy-config
  namespace: maszyna-w
data:
  HF_TARGET_URL: "https://your-space.hf.space/chat"
  ALLOWED_ORIGINS: "https://your-web-domain.example,http://localhost,capacitor://localhost"
  BODY_LIMIT_MB: "2"
  PORT: "8787"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: maszyna-w
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: maszyna-w
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hf-proxy
  namespace: maszyna-w
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hf-proxy
  template:
    metadata:
      labels:
        app: hf-proxy
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis -p 6379 ping | grep -q PONG; do
                echo "Waiting for Redis..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: hf-proxy
          image: maszyna-w-hf-proxy:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: hf-proxy-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hf-proxy
  namespace: maszyna-w
spec:
  type: ClusterIP
  selector:
    app: hf-proxy
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-relay
  namespace: maszyna-w
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-relay
  template:
    metadata:
      labels:
        app: ws-relay
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ws-relay
          image: maszyna-w-ws-relay:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 8080
          env:
            - name: WS_HOST
              value: "0.0.0.0"
            - name: WS_PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: websocket
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ws-relay
  namespace: maszyna-w
spec:
  type: ClusterIP
  selector:
    app: ws-relay
  ports:
    - name: websocket
      port: 8080
      targetPort: websocket

